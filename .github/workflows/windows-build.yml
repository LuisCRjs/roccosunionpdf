name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test and publish
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GestorExpedientes-win-x64
          path: artifacts/win-x64/GestorExpedientes.exe
          if-no-files-found: error

